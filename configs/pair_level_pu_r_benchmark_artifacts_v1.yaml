  degree_bins: ["0", "1", "2", "3-4", "5-9", "10-19", "20-49", "50-99", "100+"]
  degree_basis: interaction_supervised_training_positive_degree_only
  stratum_allocation: one_per_nonempty_stratum_then_Hamilton_proportional_apportionment
  sample_caps: {training: 2000000, C1_development: 1000000, C1_test: 1000000, C2_development: 1000000, C2_test: 1000000, C3_development: 1000000, C3_test: 1000000}
  source_exclusive_cell_id: "source_exclusive:{target_source}:{primary_cell}"
  source_exclusive_cap: inherit_primary_cell
  positive_inclusion_probability: "1/1"
  positive_sampling_weight: "1/1"
  unlabeled_inclusion_probability: "m_h/N_h_reduced"
  unlabeled_sampling_weight: "N_h/m_h_reduced"
  cross_cell_unlabeled_pair_reuse_permitted: true
  cross_cell_unlabeled_pair_reuse_must_be_reported: true
  within_cell_duplicate_pair: prohibited
  state_field_value: unlabeled
  negative_interpretation: prohibited

