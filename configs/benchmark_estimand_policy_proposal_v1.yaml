evidence_basis:
  audit_report: artifacts/validation/benchmark_design/systematic_screen_metadata_v1/AUDIT_REPORT.json
  audit_report_sha256: db75b0cb2863cc1b44e45759e924bfc4b00d379fa291873e7e3e10e99748fc5e
  audit_validation_report: artifacts/validation/benchmark_design/systematic_screen_metadata_v1/VALIDATION_REPORT.json
  audit_validation_report_sha256: 2ca92051172b7a7a512072f3ed6212ac8caed5891870abcea7c6e5929cd56a01
  audit_implementation_commit: 7af9473c876e53b777cf6ee829bbcbdf85c49fe4
  validation_result:
    status: pass
    passes: 71
    failures: 0
    warnings: 3
  critical_observations:
    huri_evidence_rows: 220934
    huri_positive_evidence_rows: 220934
    huri_negative_evidence_rows: 0
    huri_pair_view_rows: 52548
    huri_supplement_table_9_positive_pairs: 52569
    huri_supplement_table_9_screen_detection_mentions: 77653
    huri_supplement_table_9_assay_version_detection_mentions: 55534
    space_iii_genes: 17408
    space_iii_gene_pair_upper_universe_excluding_self: 151510528
    intact_explicit_negative_rows: 939
    table_15_selected_pairs: 3738
