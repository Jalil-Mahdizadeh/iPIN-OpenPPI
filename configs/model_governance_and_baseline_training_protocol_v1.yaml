      hash_payload: "{public_salt}:{deterministic_seed}:baseline:{pair_id}"
      score: unsigned_full_SHA256_digest_integer_divided_by_2_pow_256_minus_1
    endpoint_degree_sum:
      score: "log1p(d_train_a) + log1p(d_train_b)"
    preferential_attachment:
      score: "log1p(d_train_a * d_train_b)"
    component_degree_mass_product:
      component_degree_mass: sum_of_training_positive_degree_over_all_endpoints_in_frozen_component
      score: "log1p(D_component_a * D_component_b)"
    training_graph_common_neighbors:
      neighbor_graph: 16799_training_positive_pairs_only
      score: "log1p(cardinality(N_train(a) intersect N_train(b)))"
    sequence_length_sum:
      score: "log1p(length_a) + log1p(length_b)"
    sequence_length_ratio:
      score: "-abs(log1p(length_a) - log1p(length_b))"
    within_pair_3mer_cosine:
      feature_alphabet: ACDEFGHIKLMNPQRSTVWYX
      noncanonical_feature_mapping: X
      k: 3
      vector: l2_normalized_contiguous_3mer_raw_count
      score: cosine(kmer3_a,kmer3_b)
    training_interolog_3mer:
      endpoint_similarity: cosine_of_l2_normalized_contiguous_3mer_raw_counts
      training_reference_pairs: 16799_training_positive_pairs_only
      score: "max_over_(u,v)_in_P_train max(min(sim(a,u),sim(b,v)),min(sim(a,v),sim(b,u)))"
