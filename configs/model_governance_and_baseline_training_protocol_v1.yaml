    positive_key: "sha256:{salt}:{seed}:{pass_index}:P:{pair_id}"
    unlabeled_key: "sha256:{salt}:{seed}:{pass_index}:U:{pair_id}"
    sort: full_unsigned_digest_ascending_then_pair_id_ascending
