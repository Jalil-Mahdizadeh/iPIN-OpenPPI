  exact_swap_symmetry_absolute_tolerance: 0.000001
  infrastructure_failure_rule: resume_once_from_last_verified_checkpoint_without_any_parameter_or_order_change
  repeated_infrastructure_failure: mark_run_failed_no_replacement_recipe_or_seed
  numerical_failure_rule: mark_run_failed_no_retry_with_changed_settings

compute_budget:
  hardware: one_NVIDIA_GH200_120GB
  four_gpu_or_multi_node_training: prohibited_in_first_stage
  embedding_extractions: exactly_one_complete_pass_per_frozen_candidate_plus_prespecified_one_percent_repeat
  maximum_total_gpu_hours: 100
  maximum_project_storage_gib: 100
  walltime_or_resource_increase: requires_numbered_amendment_before_development_release

development_release_and_model_selection:
  development_status_now: encrypted_unreleased
  training_stage_requires_separate_numbered_authorization: true
  before_release_requirements:
    - all_prespecified_candidate_runs_complete_or_fail_closed
    - selected_training_checkpoint_frozen_for_each_successful_run
    - three_seed_ensemble_definition_frozen_per_model_family_and_recipe
    - model_code_container_config_embedding_input_and_checkpoint_hashes_registered
    - complete_training_artifact_registry_sha256_frozen
    - independent_training_artifact_validation_passed
    - new_numbered_development_release_decision
  ensemble_score: arithmetic_mean_of_the_three_run_seed_scores
  individual_seed_selection_on_development: prohibited
  development_actions:
    score_only_preexisting_frozen_candidates: true
    new_training_or_retraining: prohibited
    new_recipe_architecture_seed_or_checkpoint: prohibited
    post_release_feature_or_embedding_change: prohibited
    protected_information_visible: false
  eligibility:
    all_three_seed_runs_required: true
    complete_unique_finite_scores_required: true
    symmetry_and_hash_guards_required: true
    maximum_seed_metric_range_each_primary_cell: 0.02
  selection_metric_order:
    metric: horvitz_thompson_positive_vs_U_pairwise_concordance
    cells: [C3_development, C2_development, C1_development]
    quantization: decimal_0.001_ROUND_HALF_UP_for_selection_only
    tie_breaks:
      - higher_quantized_C3_development
      - higher_quantized_C2_development
      - higher_quantized_C1_development
      - lower_complexity_order
      - lexicographically_ascending_candidate_id
    lower_complexity_order:
      - lightweight_esm2_150m_linear
      - esm2_650m_linear_ablation
      - esm2_650m_nonlinear_no_gate_ablation
      - esm2_650m_partner_gated_primary
  metric_pooling_across_C1_C2_C3: prohibited
  novel_U_sensitivity_used_for_selection: false
  source_exclusive_diagnostics_used_for_selection: false
  post_selection_retraining: prohibited
  selected_scorer_freeze_required_before_any_protected_candidate_access: true

evaluation_and_reporting:
  primary_metric:
    name: horvitz_thompson_positive_vs_U_pairwise_concordance
    formula: "sum_over_p_and_u(w_u * (I(s_p>s_u)+0.5*I(s_p=s_u))) / (n_P * sum_over_u(w_u))"
    exact_score_ties: half_credit
  cell_reporting_order: [C3, C2, C1]
  partition_reporting_order: [development, protected_test]
  cells_must_remain_separate: true
  no_pooled_headline_metric: true
  primary_comparisons:
    strongest_mandatory_baseline: max_within_cell_using_same_frozen_rows_weights_and_ties
    model_delta: absolute_concordance_difference
    paired_bootstrap: identical_frozen_candidate_rows_and_component_draws
  uncertainty:
    method: two_endpoint_component_pigeonhole_bootstrap
    dependence_unit: frozen_local_domain_union_30_component
    replicates: 2000
    seed: "20260803"
    numpy_generator: PCG64DXSM
    interval: percentile_95
    sampling_and_bootstrap_weights_both_retained: true
  conditional_full_ranking_metrics:
    status: demoted_until_exact_streaming_full_candidate_scoring_is_separately_authorized
    metrics:
      - heldout_released_positive_recall_at_10_100_1000
      - released_positive_enrichment_at_0.0001_0.001_0.01
      - positive_rank_percentile_mean_median_q10_q90
    sampled_package_must_not_be_called_full_universe: true
  diagnostic_only:
    - sampled_positive_vs_U_AUROC
    - sampled_positive_vs_U_AUPRC
    - score_correlation_with_degree_length_and_similarity_controls
  prohibited_metric_interpretations:
    - biological_classification_performance
    - biological_precision_or_false_positive_rate
    - assay_or_binding_probability
    - prevalence_or_calibration

degree_and_hub_stratification:
  degree_source: 16799_interaction_supervision_training_positives_only
  degree_bins: ["0", "1", "2", "3-4", "5-9", "10-19", "20-49", "50-99", "100+"]
  pair_stratum: sorted_pair_of_endpoint_training_degree_bins
  hubs:
    ranking: training_positive_degree_descending_then_sequence_sha256_ascending
    nested_top_fractions: [0.01, 0.05, 0.10]
    frozen_endpoint_counts: [119, 595, 1190]
    frozen_minimum_degrees: [41, 14, 7]
  heldout_endpoint_degree: 0
  reporting:
    - each_supported_degree_pair_stratum
    - pair_contains_top_1_percent_training_hub_vs_not
    - pair_contains_top_5_percent_training_hub_vs_not
    - pair_contains_top_10_percent_training_hub_vs_not
  quantitative_stratum_floor:
    positive_pairs: 100
    participating_components: 10
  below_floor: descriptive_only_no_pooling_to_hide_failure
  protected_or_development_positive_degree_feature: prohibited

c1_novel_U_sensitivity:
  status: prespecified_view_only_not_executed
  cells: [C1_development, C1_test]
  positive_rows: unchanged_complete_frozen_cell_positive_rows
  U_inclusion_rule: frozen_C1_U_row_pair_id_absent_from_frozen_public_training_U_pair_ids
  new_rows_or_resampling: prohibited
  primary_cell_or_weight_modification: prohibited
  original_rational_design_weight: retained_unchanged_per_retained_U_row
  conditional_metric: "sum_over_p_and_retained_u(w_u * (I(s_p>s_u)+0.5*I(s_p=s_u))) / (n_P * sum_over_retained_u(w_u))"
  interpretation: design_weighted_Hajek_ratio_over_the_realized_novel_U_view_not_a_new_population_sample
  required_counts:
    - retained_and_removed_U_rows
    - retained_weight_sum
    - retained_nonempty_strata
    - retained_pair_id_uniqueness
  development_use: only_after_separately_authorized_development_release
  protected_test_use: evaluator_only_after_prediction_freeze_and_one_first_reservation
  model_selection_or_stopping_use: prohibited

complexity_justification:
  simple_partner_gate_retained_only_if:
    - "C3 development concordance gain versus strongest simple sequence baseline is at least 0.02"
    - "paired component-bootstrap 95 percent interval for that gain excludes zero"
    - "C3 gain versus esm2_650m_linear_ablation is at least 0.01 and its paired interval excludes zero"
    - "gain versus esm2_650m_nonlinear_no_gate_ablation is at least 0.005 and its paired interval excludes zero"
    - positive_direction_on_at_least_one_supported_named_source_development_cell
    - gain_not_restricted_to_training_hub_strata
    - all_three_seed_runs_stable_and_eligible
  fallback_order:
    - remove_partner_gate_if_gate_specific_threshold_fails
    - remove_nonlinear_head_if_no_gate_model_does_not_beat_linear_650m
    - retain_lightweight_150m_linear_only_if_650m_scale_is_not_justified
    - terminate_learned_model_line_if_no_learned_candidate_beats_deterministic_controls
  proposal_of_residue_joint_encoder_sparse_routing_or_other_complex_model_requires:
    - accepted_results_from_this_simple_stage
    - primary_PU_statistical_gate_pass_on_qualifying_C3
    - unresolved_error_pattern_not_explained_by_degree_length_3mer_interolog_or_frozen_PLM_linear_controls
    - separately_authorized_oracle_or_interface_evidence_study_under_existing_blueprint_gate
    - prespecified_compute_and_efficiency_case
    - new_numbered_governance_decision

model_level_kill_criteria:
  any_integrity_custody_or_protected_boundary_violation: invalidate_stage_and_stop
  any_use_of_U_as_scientific_negative_or_probability_target: invalidate_stage_and_stop
  no_learned_candidate_C3_gain_at_least_0.02_over_strongest_mandatory_baseline_with_interval_excluding_zero: stop_before_protected_test
  best_learned_candidate_C3_lower_confidence_bound_not_above_0.5: stop_before_protected_test
  degree_graph_or_length_control_matches_or_exceeds_learned_C1_and_no_qualifying_C2_or_C3_gain: shortcut_explains_result_stop
  training_interolog_or_frozen_PLM_linear_baseline_explains_C3_with_complex_delta_below_0.01_or_interval_including_zero: reject_complex_model
  gain_absent_outside_top_10_percent_hub_pairs: hub_shortcut_stop_complex_model
  C1_gain_disappears_or_reverses_in_novel_U_view: withdraw_C1_gain_claim_and_require_C2_or_C3_gate
  any_candidate_seed_metric_range_above_0.02: candidate_ineligible
  all_candidates_ineligible_or_numerically_failed: stop_model_line
  unsupported_source_assay_temporal_family_or_PLM_exposure_claim_needed_to_describe_gain: stop_claim_and_return_to_governance
  development_release_precedes_complete_training_artifact_registry_hash: invalidate_release_and_stop
  new_candidate_training_or_retraining_after_development_release: invalidate_selection_and_stop

claim_policy:
  permitted:
    - recovery_and_ranking_of_withheld_released_positive_evidence
    - symmetric_sequence_compatibility_or_prioritization_score
    - exact_endpoint_C3_under_frozen_local_domain_union_30_rule
    - named_source_release_transfer_only_in_supported_cells
  prohibited:
    - unlabeled_is_negative_nonbinding_or_failed_assay
    - universal_nonbinding_or_positive_negative_benchmark
    - biological_or_natural_prevalence
    - biological_precision_specificity_or_false_positive_rate
    - calibrated_assay_or_binding_probability
    - score_is_probability_or_experimentally_validated_interaction
    - C3_is_unseen_gene_isoform_homolog_domain_family_or_nonhomology
    - PLM_unseen_endpoint_or_family
    - pretraining_exposure_cleanliness_or_causal_exposure_effect
    - sampled_U_is_full_candidate_universe
    - source_is_independent_study_assay_batch_or_temporal_generalization
    - external_panel_structure_residue_or_interface_claim

outputs:
  binding_protocol: docs/protocols/MODEL_GOVERNANCE_AND_BASELINE_TRAINING_PROTOCOL_v1.md
  scientific_report: docs/reports/m1/M1_Model_Governance_and_Baseline_Training_Protocol_Final_v1.md
  production_audit: artifacts/validation/model_governance/model_governance_and_baseline_training_protocol_v1/AUDIT_REPORT.json
  independent_validation: artifacts/validation/model_governance/model_governance_and_baseline_training_protocol_v1/VALIDATION_REPORT.json
  pair_model_embedding_checkpoint_or_prediction_artifacts: prohibited
