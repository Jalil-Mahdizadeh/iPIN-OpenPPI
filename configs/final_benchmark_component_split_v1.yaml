leakage_partition_policy:
  identity_threshold_percent: 30
  primary_hard_rule:
    id: local_domain_union
    definition: accepted_fl80_edges_union_full_length_sensitivity_edges_union_local_domain_edges
    minimum_identity: 0.30
    full_length_minimum_endpoint_coverage: 0.80
    local_minimum_endpoint_coverage: 0.20
    local_minimum_aligned_endpoint_span: 80
    local_maximum_evalue: 0.001
  fallback_hard_rule:
    id: sensitive_fl80_union
    definition: accepted_fl80_edges_union_full_length_sensitivity_edges
    minimum_identity: 0.30
    minimum_endpoint_coverage: 0.80
  component_algorithm: deterministic_connected_components_single_linkage
  edge_policy: accepted_edges_may_be_added_to_but_never_removed
  fallback_trigger: zero_primary_candidates_pass_every_frozen_acceptance_criterion
  evaluate_fallback_when_primary_valid: false
  verify_selected_split_against: [local_domain_union, sensitive_fl80_union]
  exhaustive_homology_claim_authorized: false
  unseen_biological_family_claim_authorized: false
  plm_unseen_protein_claim_authorized: false

allocation:
  candidate_count_per_definition: 4096
  deterministic_seed: "20260803"
  public_hash_salt: ipin-openppi-final-benchmark-component-split-v1
  target_endpoint_fractions: {train: 0.70, development: 0.15, test: 0.15}
  partition_iteration_and_tie_order: [train, development, test]
  candidate_component_order: sha256_salted_base_order_then_candidate_specific_coprime_cyclic_permutation
  allocation_algorithm: assign_next_component_to_largest_relative_endpoint_deficit
  component_order_hash_payload: "{salt}:{definition}:component:{component_representative_sha256}"
  candidate_order_hash_payload: "{salt}:{seed}:{definition}:candidate:{candidate_index}"
  stride_rule: increment_modulo_component_count_until_positive_and_coprime
  relative_deficit_tie_break: earliest_partition_iteration_and_tie_order
  score_quantization_scale: 1000000000
  score_quantization_rule: nearest_integer_half_up_on_nonnegative_rational
  objective_direction: lexicographic_minimum
  frozen_selection_objective:
    - minimize_maximum_absolute_endpoint_fraction_deviation
    - maximize_minimum_normalized_evidence_ratio_over_all_frozen_pair_component_and_source_floors
    - minimize_maximum_development_test_relative_opportunity_imbalance_over_c2_c3_and_all_sources
    - minimize_maximum_source_presence_fraction_deviation_from_global_released_positive_union
    - minimize_maximum_positive_degree_mass_fraction_deviation_from_endpoint_targets
    - minimize_maximum_global_hub_endpoint_fraction_deviation_from_endpoint_targets
    - minimize_sum_absolute_endpoint_count_deviation_from_targets
    - minimize_candidate_index
  allocation_uses_model_results: false
  future_model_results_inspected: false

opportunity_definitions:
  C1: within_training_released_positive_pair_with_each_endpoint_having_at_least_one_other_within_training_positive_partner
  C2: exactly_one_endpoint_in_training_and_one_in_named_heldout_partition_with_training_endpoint_positive_exposed_in_training
  C3: both_exact_endpoints_in_same_named_heldout_partition_and_absent_from_interaction_supervised_training_with_components_disjoint_from_training_under_selected_rule
  c2_exclusive: true
  evaluation_pools:
    - {axis: C1, evaluation_partition: training_pool}
    - {axis: C2, evaluation_partition: development}
    - {axis: C2, evaluation_partition: test}
    - {axis: C3, evaluation_partition: development}
    - {axis: C3, evaluation_partition: test}
  interaction_supervised_training_endpoint_partitions: [train]
  pair_level_label_output_authorized: false

acceptance_criteria:
  maximum_absolute_endpoint_fraction_deviation: 0.03
  minimum_released_positive_pairs_each_opportunity_pool: 500
  minimum_participating_components_each_opportunity_pool: 50
  minimum_released_positive_pairs_per_source_each_opportunity_pool: 50
  required_sources: [HI-II-14, HuRI]
  source_presence_reference: global_released_positive_union
  maximum_absolute_source_presence_fraction_deviation: 0.10
  maximum_development_test_relative_opportunity_imbalance: 0.35
  degree_population: all_eligible_endpoints
  maximum_absolute_positive_degree_mass_fraction_deviation: 0.10
  global_hub_fractions: [0.01, 0.05, 0.10]
  global_hub_rank_order: positive_degree_descending_then_reference_sequence_sha256_ascending
  maximum_absolute_global_hub_endpoint_fraction_deviation: 0.10
  selected_hard_rule_cross_partition_edge_count: 0
  selected_hard_rule_cross_partition_component_count: 0
  primary_selection_requires_sensitive_fl80_union_cross_partition_edge_count: 0
  all_criteria_are_hard_and_conjunctive: true

