pair_assignment:
  public_salt: ipin-openppi-pair-level-pu-r-protocol-v1
  deterministic_seed: "20260803"
  hash: SHA256
  c1_positive_role:
    hash_payload: "{public_salt}:{deterministic_seed}:primary:C1:{pair_id}"
    integer: unsigned_big_endian_first_8_digest_bytes
    bucket: integer_modulo_10000
    bucket_intervals:
      train: [0, 7000]
      development: [7000, 8500]
      test: [8500, 10000]
    assignment_is_label_blind: true
    role_hash_uses_source_study_assay_degree_or_model_result: false
  interaction_supervised_training_positives:
    rule: released_positive_train_train_pairs_with_c1_hash_role_train
  training_exposed_endpoint:
    rule: train_endpoint_with_degree_at_least_one_in_interaction_supervised_training_positives
    degree_uses_withheld_or_heldout_edges: false
  C1:
    development: train_train_positive_with_hash_role_development_and_both_endpoints_training_exposed
    test: train_train_positive_with_hash_role_test_and_both_endpoints_training_exposed
    pair_absent_from_interaction_supervised_training: true
  C2:
    development: exactly_one_training_exposed_train_endpoint_and_one_development_endpoint
    test: exactly_one_training_exposed_train_endpoint_and_one_test_endpoint
    exclusive_of_C3: true
  C3:
    development: both_exact_endpoints_in_development
    test: both_exact_endpoints_in_test
    exact_endpoints_absent_from_interaction_supervised_training: true
    component_disjoint_under: local_domain_union_30
  quarantine:
    - development_test_cross_partition_pair
    - train_train_positive_with_development_or_test_hash_role_failing_training_exposure_guard
    - train_heldout_positive_whose_train_endpoint_is_not_training_exposed
    - self_pair_or_same_frozen_sequence_hash
    - ambiguous_or_unmapped_positive_projection
    - any_pair_failing_source_or_cutoff_eligibility
  reassignment_after_quarantine: prohibited

positive_withholding_and_leakage:
