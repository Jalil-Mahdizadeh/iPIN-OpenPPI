unlabeled_sampling:
  realization_status: prohibited_in_this_work_package
  method: deterministic_stratified_bottom_hash_without_replacement
  hash: SHA256
  public_salt: ipin-openppi-benchmark-v1
  deterministic_seed: "20260803"
  hash_payload: "{public_salt}:{deterministic_seed}:unlabeled:{cell_id}:{stratum_id}:{pair_id}"
  hash_order: full_256_bit_unsigned_integer_ascending_then_pair_id_ascending
  degree_bins: ["0", "1", "2", "3-4", "5-9", "10-19", "20-49", "50-99", "100+"]
  degree_basis: interaction_supervised_training_positive_degree_only
  pair_stratum: lexicographically_ordered_endpoint_degree_bin_pair
  sample_caps:
    training: 2000000
    C1_development: 1000000
    C1_test: 1000000
    C2_development: 1000000
    C2_test: 1000000
    C3_development: 1000000
    C3_test: 1000000
  total_cell_sample_size: min_unlabeled_candidate_count_and_cell_cap
  stratum_allocation:
    method: one_per_nonempty_stratum_then_Hamilton_proportional_apportionment
    remainder_tie_break: fractional_remainder_descending_then_stratum_id_ascending
    allocation_never_exceeds_stratum_population: true
  selected_pairs: lowest_hashes_within_cell_and_stratum
  positive_inclusion_probability: 1.0
  positive_sampling_weight: 1.0
  unlabeled_inclusion_probability: "m_h / N_h"
  unlabeled_sampling_weight: "N_h / m_h"
  zero_probability_nonempty_stratum: prohibited
  record_fields_when_later_realized: [cell_id, stratum_id, pair_id, hash_key, N_h, m_h, inclusion_probability, sampling_weight, state]
  state_field_value: unlabeled
  scientific_negative_interpretation: prohibited
  sampled_precision_or_prevalence_interpretation: prohibited
  full_candidate_scoring:
    preferred: true
    materialization_required: false
    exact_streaming_allowed: true
    inability_to_full_score_action: demote_exact_recall_and_exact_rank_metrics_not_redefine_sample_as_full_universe

metrics:
  score_requirement: symmetric_nonprobabilistic_sequence_compatibility_prioritization_score
  score_tie_break: pair_id_ascending
  primary:
    positive_unlabeled_pairwise_concordance:
      definition: weighted_probability_heldout_positive_score_exceeds_unlabeled_score_plus_half_ties_within_cell
      sampled_unlabeled_estimator: Horvitz_Thompson_weighted
    heldout_positive_recall_at_k:
      k: [10, 100, 1000]
      query_orientation:
        C1: both_endpoints_as_queries
        C2: heldout_endpoint_as_query_only
        C3: both_endpoints_as_queries
      aggregation: macro_over_queries_primary_micro_over_positive_pairs_secondary
      requires_full_candidate_ranking: true
    released_positive_enrichment_at_candidate_fraction:
      fractions: [0.0001, 0.001, 0.01]
      cutoff_count: ceiling_fraction_times_query_candidate_count_minimum_one
      definition: observed_heldout_positive_recall_in_top_fraction_divided_by_fraction
      precision_interpretation: prohibited
    positive_rank_percentile:
      definition: fraction_of_eligible_candidates_scored_below_positive_plus_half_ties
      range: [0.0, 1.0]
      higher_is_better: true
      report: [mean, median, q10, q90]
  always_report:
    - C1_C2_C3_and_development_test_cells_separately
    - surviving_positive_pairs_and_queries
    - eligible_and_sampled_unlabeled_candidates
    - endpoint_and_component_counts
    - source_membership_and_supported_holdout_strata
    - training_degree_and_hub_strata
    - nearest_training_similarity_rule_name
    - inclusion_probabilities_and_weights
  diagnostic_only:
    - sampled_positive_vs_unlabeled_AUPRC
    - sampled_positive_vs_unlabeled_AUROC
    - release_propensity_log_loss
    - graph_metrics
  prohibited:
    - biological_precision
    - biological_false_positive_rate
    - prevalence
    - calibrated_binding_probability
    - calibrated_assay_probability
    - proteome_wide_precision

uncertainty:
  primary_dependence_unit: frozen_local_domain_union_30_sequence_component
  method: two_endpoint_component_pigeonhole_bootstrap
  replicates: 2000
  deterministic_seed: "20260803"
