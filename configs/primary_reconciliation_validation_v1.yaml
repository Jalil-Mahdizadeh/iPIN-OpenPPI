known_blockers:
  - issue_id: ISSUE-0003
    status: open
    reason: >-
      Public HuRI records do not reconstruct the complete selected, attempted,
      technically evaluable pair universe. Unreported pairs remain unknown and
      may not be converted into negatives.
  - issue_id: ISSUE-0004
    status: retained_as_source_limitation
    reason: >-
      The deterministic reconciliation quantifies detailed evidence, unique
      gene and ORF projections, orientations, self-pairs, and pair-view
      membership, but the public records do not exactly reproduce the provider
      headline transformation for HuRI or HI-II-14.
  - issue_id: ISSUE-0005
    status: open
    reason: >-
      SIFTS declares UniProt 2026.03 while the frozen sequence corpus is
      UniProt 2026_02. Exact structure mapping and structure-derived labels
      remain blocked.
