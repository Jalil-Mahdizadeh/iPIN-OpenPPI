normalization:
  fit: all_public_endpoints_outside_evaluation_fold
  mean_and_population_std: float64
  standard_deviation_floor: 0.000001
  output_dtype: float32
models:
  - endpoint_linear
  - endpoint_mlp64
  - pair_linear
training:
  seeds: [20260911, 20260912, 20260913]
  complete_passes: 5
  comparisons_per_batch: 4096
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  epsilon: 0.00000001
  gradient_clip_norm: 1.0
  warmup_fraction: 0.05
  final_learning_rate_fraction: 0.1
  objective: globally_paired_P_vs_U_softplus_with_U_design_weight_over_fit_mean
  order: PCG64DXSM_seed_plus_pass_permutation_of_canonical_numeric_pair_order
  positive_repetition: cycle_permuted_P_with_pass_minus_one_offset
  checkpoint: final_pass_only
evaluation:
  primary: equal_anchor_macro_design_weighted_within_anchor_P_vs_U_concordance
  ensemble: arithmetic_mean_raw_scores_across_fixed_seeds_within_fold
  primary_comparator: endpoint_mlp64
  secondary_comparators: [endpoint_linear, length_ratio, kmer3_cosine, pooled_cosine]
  candidate_panel: only_released_C3_P_and_sampled_U_rows_incident_to_anchor
  eligibility: at_least_one_released_P_and_one_sampled_U_partner
  ties: half_credit
  recall_at: [10, 100]
  recall_interpretation: unweighted_released_candidate_panel_only_not_full_universe
  bootstrap:
    scheme: paired_component_Poisson_1_multiplier_all_unique_endpoint_components
    replicates: 2000
    seed: 20260914
    percentile: [2.5, 97.5]
    conditional_on: fitted_models_fixed_folds_and_released_candidate_panel
  propensity_sensitivity:
    bins: 5
    boundaries: quintiles_of_endpoint_mlp64_fit_endpoint_scores_only
    comparisons: P_and_U_partners_in_same_bin_then_equal_anchor_mean
quartets:
  positives: two_distinct_released_C3_P_edges_with_four_distinct_endpoints
  crosses: both_cross_edges_must_exist_in_released_C3_U_panel
  enumerate: both_distinct_cross_pairings_for_every_unordered_P_edge_pair
  selection: ascending_salted_sha256_of_fold_and_oriented_endpoint_indices
  maximum_per_fold: 2000
  maximum_uses_per_positive_edge: 10
  maximum_uses_per_endpoint: 50
  statistic: fraction_positive_raw_score_contrast_with_half_credit_for_ties
  tie_absolute_tolerance: 0.000001
  weighting: uniform_selected_quartets_no_claim_of_population_HT_estimation
  bootstrap_weight: product_of_multipliers_of_unique_components_among_four_endpoints
feasibility:
  minimum_fit_positive_per_fold: 500
  minimum_eligible_anchors_per_fold: 200
  minimum_anchor_components_per_fold: 50
  minimum_quartets_per_fold: 100
  minimum_quartet_components_per_fold: 50
  synthetic_power_component_effect_sd: [0.05, 0.1, 0.2]
  synthetic_power_target: 0.8
  synthetic_power_interpretation: illustrative_component_only_sensitivity_not_empirical_power_guarantee
decision:
  minimum_primary_delta: 0.02
  paired_95_lower_must_exceed: 0.0
  require_positive_delta_in_each_fold_and_seed: true
  require_positive_delta_vs_endpoint_linear_and_each_fixed_pair_control: true
  require_positive_propensity_stratified_delta: true
  require_quartet_95_lower_above: 0.5
  require_positive_quartet_delta_vs_length_and_kmer_controls: true
  tight_negative_if_primary_95_upper_below: 0.02
  other: inconclusive_or_mixed_internal_evidence
