  preserve_construct_and_sequence_confirmation: true
  imex_preview_is_intact_release_252: false
  return_to_governance_before_integration: true

known_gaps:
  - IM-30553 is curated but not integrated into IntAct services at the acquisition date; preview exports are a dated provider snapshot, not IntAct Release 252.
  - Export endpoints do not expose stable payload checksums or HTTP version identifiers; local SHA-256 and retrieval metadata define the frozen preview snapshot.
  - The 3,222-pair subset was selected by a later prediction-list filter and must not be treated as the original random sample without explicit inclusion analysis.

