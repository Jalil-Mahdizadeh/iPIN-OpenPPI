verification:
  calculate_sha256: true
  verify_provider_checksum: when_available
  capture_http_headers: true
  record_count_and_schema_report: required
  confirm_stringent_is_exact_subset_of_parent: required
  confirm_official_counts: required

guards:
  unreported_pairs_are_negative: false
  universal_nonbinding_interpretation: false
  preserve_manual_and_pdb_families_separately: true
  preserve_stringent_membership_as_historical_filter_only: true
  preserve_accession_isoform_suffixes: true
  preserve_publication_assay_pdb_and_orientation_fields: true
  current_positive_crosscheck_required_before_any_diagnostic_use: true
  raw_redistribution_allowed: false

known_gaps:
  - The manual files expose accession pairs, PubMed identifiers, and PSI-MI method text but no construct boundaries, orientation, batch, repeat, technical-evaluability, or detailed experimental-condition fields.
  - The PDB files expose accession pairs, PDB codes, and X-ray method text but no chain identifiers or explicit distance/contact threshold in the row payload.
  - Stringent membership reflects filtering against a historical IntAct snapshot, not the current frozen IntAct release.
  - No explicit database-payload redistribution license was located.

approved_actions:
  - internal_download_to_immutable_raw_zone
  - checksum_and_record_count_validation
  - provenance_preserving_parsing
  - frozen_human_uniprot_mapping
  - current_positive_and_intact_negative_reconciliation
  - aggregate_non_extractive_reporting
prohibited_actions:
  - raw_or_record_level_redistribution_without_permission
  - infer_universal_nonbinding
  - combine_manual_and_structure_noncontact_as_one_negative_class
  - treat_historical_stringent_filter_as_current_conflict_free_status
  - construct_training_labels_or_start_model_training
