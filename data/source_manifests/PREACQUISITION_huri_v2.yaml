verification:
  calculate_sha256: true
  verify_provider_checksum: when_available
  capture_http_headers: true
  detect_actual_format_before_parsing: true
  record_count_and_schema_report: required

guards:
  published_payloads_only: true
  nature_supplements_redistributed_raw: false
  unreported_pairs_are_negative: false
  space_iii_cross_product_is_complete_attempted_universe: false
  technical_failures_are_negative: false
  invalid_or_autoactivating_tests_are_negative: false
  explicit_supplementary_test_outcomes_keep_original_control_scope: true

known_gaps:
  - The public portal and supplementary guide do not expose a complete pair-level attempted and evaluable matrix for all nine HuRI Space III screens.
  - The public Test-space PSI-MI link returned HTTP 404 at audit time.
  - Portal pair files are positive interaction lists and cannot define negatives by complement.
  - Nature supplementary files do not inherit the portal's CC BY 4.0 declaration; their raw redistribution remains disabled.

approved_actions:
  - download_portal_data_to_immutable_raw_zone
  - download_nature_supplements_for_internal_reconstruction_audit
  - checksum_and_format_inspection
  - parse_positive_records_and_explicit_published_controls
prohibited_actions:
  - redistribute_raw_nature_supplementary_files
  - construct_primary_negative_labels
  - infer_attempted_pairs_from_cartesian_product
  - train_model_before_evidence_gate
