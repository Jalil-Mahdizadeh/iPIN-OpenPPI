known_gaps:
  - The public clean pairwise table contains 1,260 blank Y2H result cells; resolution depends on archived raw technical-state fields and must fail closed if absent or ambiguous.
  - The tested panel was conditioned on first-pass discovery by at least one isoform and expanded to cognate isoforms, so it is not prevalence-representative.
  - The article PDF is public but copyright-restricted; only hashes and original audit prose may enter Git.

