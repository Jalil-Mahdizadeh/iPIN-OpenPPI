  claim_assessments:
    description: Fail-closed claim disposition derived from aggregate feasibility and leakage evidence.
    primary_key: [claim_id]
    required_non_null:
      - claim_id
      - claim_name
      - leakage_definition
      - identity_threshold_percent
      - supported_by_audit
      - claim_status
      - permitted_wording
      - prohibited_wording
      - rationale
      - model_performance_claimed
      - experimental_validation_claimed
    enum_columns:
      leakage_definition: leakage_definition
      identity_threshold_percent: identity_threshold_percent
      claim_status: claim_status
    columns:
