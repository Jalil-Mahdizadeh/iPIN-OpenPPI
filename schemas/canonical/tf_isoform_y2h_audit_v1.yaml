schema_name: ipin_openppi_tf_isoform_y2h_audit
schema_version: 1
description: >-
  Governance-bounded reconstruction of the Lambourne et al. 2025 human
  TF-isoform pairwise Y2H panel and continuous N2H observations. Assay
  negatives are contextual observations, never universal nonbinding labels.

enums:
  outcome_class:
    - positive_y2h_observation
    - explicit_negative_y2h_observation
    - sequence_confirmation_failure
    - mating_or_spotting_failure
    - assay_measurement_failure
    - autoactivation
    - unknown_unresolved
  evaluability_state: [evaluable, technically_unevaluable]
  observation_state: [positive, negative, not_applicable]

