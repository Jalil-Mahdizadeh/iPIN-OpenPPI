      - {name: reference_raw_file_paths, type: "list<string>", nullable: false}
      - {name: reference_raw_file_sha256s, type: "list<string>", nullable: false}
      - {name: universal_nonbinding_asserted, type: bool, nullable: false}
      - {name: label_authorized, type: bool, nullable: false}
