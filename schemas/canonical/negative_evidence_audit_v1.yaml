      - {name: mapped_isoform_id, type: string, nullable: true}
      - {name: mapped_sequence_sha256, type: string, nullable: true}
      - {name: mapped_sequence_length, type: int64, nullable: true}
      - {name: mapped_sequence_view, type: string, nullable: true}
      - {name: mapped_sequence_version, type: int32, nullable: true}
      - {name: mapped_entry_version, type: int32, nullable: true}
      - {name: mapped_taxid, type: int64, nullable: true}
      - {name: mapped_species_name, type: string, nullable: true}
      - {name: organism_state, type: string, nullable: false}
      - {name: isoform_mapping_state, type: string, nullable: true}
      - {name: reference_sequence_usable, type: bool, nullable: false}
      - {name: exact_unique_mapping, type: bool, nullable: false}
      - {name: construct_confidence, type: string, nullable: false}
      - {name: construct_sequence_sha256, type: string, nullable: true}
      - {name: construct_start, type: int64, nullable: true}
