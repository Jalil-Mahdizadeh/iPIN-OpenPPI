schema_name: ipin_openppi_negative_evidence_audit
schema_version: 1
description: >-
  Internal-only, provenance-preserving Negatome and frozen IntAct negative-evidence
  audit. No row in this contract is a universal nonbinding label.

enums:
  negatome_dataset: [manual, manual_stringent, pdb, pdb_stringent]
  evidence_family: [manual_experimental_negative, structure_derived_noncontact]
  mapping_state:
    - exact_primary_canonical
    - exact_isoform
    - exact_additional_non_isoform
    - secondary_accession_unique
    - canonical_isoform1_alias
    - ambiguous_frozen_accession
    - not_in_frozen_human_reference
  mapping_confidence:
    - A_exact_frozen_identifier
    - B_unique_frozen_secondary_accession
    - C_canonical_isoform1_alias
    - D_unmapped_or_ambiguous
  pair_mapping_state: [both_unique_human, one_unique_human, neither_unique_human]
  reliability_tier: [ME-1, ME-2, SN-1, SN-2, MX]

tables:
  negatome_source_records:
    description: One row per physical data row in each of the four Negatome files.
    required_non_null:
      - source_record_id
      - parent_record_id
      - source_dataset
      - evidence_family
      - parent_dataset
      - source_record_ordinal
      - source_accession_a
      - source_accession_b
      - source_base_accession_a
      - source_base_accession_b
      - publication_ids
      - pdb_ids
      - assay_text
      - orientation_state
      - attempted_state
      - evaluability_state
      - technical_state
      - observation_state
      - stringent_file
      - raw_file_path
      - raw_file_sha256
      - raw_locator
      - license_id
      - redistribution_tier
      - universal_nonbinding_asserted
      - label_authorized
      - source_fields_json
      - missingness_json
    enum_columns:
      source_dataset: negatome_dataset
      evidence_family: evidence_family
    columns:
      - {name: source_record_id, type: string, nullable: false}
      - {name: parent_record_id, type: string, nullable: false}
      - {name: source_dataset, type: string, nullable: false}
      - {name: evidence_family, type: string, nullable: false}
      - {name: parent_dataset, type: string, nullable: false}
      - {name: source_record_ordinal, type: int64, nullable: false}
      - {name: source_accession_a, type: string, nullable: false}
      - {name: source_accession_b, type: string, nullable: false}
      - {name: source_base_accession_a, type: string, nullable: false}
      - {name: source_base_accession_b, type: string, nullable: false}
      - {name: source_isoform_id_a, type: string, nullable: true}
      - {name: source_isoform_id_b, type: string, nullable: true}
      - {name: publication_ids, type: "list<string>", nullable: false}
      - {name: pdb_ids, type: "list<string>", nullable: false}
      - {name: assay_mi_ac, type: string, nullable: true}
      - {name: assay_text, type: string, nullable: false}
      - {name: construct_a_json, type: string, nullable: true}
      - {name: construct_b_json, type: string, nullable: true}
      - {name: orientation_a, type: string, nullable: true}
      - {name: orientation_b, type: string, nullable: true}
      - {name: orientation_state, type: string, nullable: false}
      - {name: source_taxid_a, type: int64, nullable: true}
      - {name: source_taxid_b, type: int64, nullable: true}
      - {name: source_species_name_a, type: string, nullable: true}
      - {name: source_species_name_b, type: string, nullable: true}
      - {name: experimental_conditions_json, type: string, nullable: true}
      - {name: attempted_state, type: string, nullable: false}
      - {name: evaluability_state, type: string, nullable: false}
      - {name: technical_state, type: string, nullable: false}
      - {name: observation_state, type: string, nullable: false}
      - {name: stringent_file, type: bool, nullable: false}
      - {name: raw_file_path, type: string, nullable: false}
      - {name: raw_file_sha256, type: string, nullable: false}
      - {name: raw_locator, type: string, nullable: false}
      - {name: license_id, type: string, nullable: false}
      - {name: redistribution_tier, type: string, nullable: false}
      - {name: universal_nonbinding_asserted, type: bool, nullable: false}
      - {name: label_authorized, type: bool, nullable: false}
      - {name: source_fields_json, type: string, nullable: false}
      - {name: missingness_json, type: string, nullable: false}

  negatome_participant_mappings:
    description: One frozen-reference mapping result per participant of each parent record.
    required_non_null:
      - mapping_record_id
      - parent_record_id
      - evidence_family
      - participant_ordinal
      - source_accession
      - source_base_accession
      - mapping_state
      - mapping_confidence
      - mapping_basis
      - mapping_candidate_count
      - candidate_sequence_ids
      - candidate_sequence_sha256s
      - candidate_uniprot_accessions
      - organism_state
      - reference_sequence_usable
      - exact_unique_mapping
      - construct_confidence
      - frozen_uniprot_release
      - reference_raw_file_paths
      - reference_raw_file_sha256s
      - universal_nonbinding_asserted
      - label_authorized
      - missingness_json
