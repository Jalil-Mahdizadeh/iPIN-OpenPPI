schema_name: ipin_openppi_lambourne_y2h_semantics_audit
schema_version: 1
description: >-
  Internal, governance-bounded representation of the Lambourne et al. 2026
  human Y2H-v1 selected-pair panel. Outcomes are assay observations, never
  reusable training labels or universal nonbinding assertions.

enums:
  outcome_semantics:
    - positive_assay_observation
    - negative_assay_observation
    - technically_unevaluable_sequence_confirmation
    - technically_unevaluable_autoactivator
    - technically_unevaluable_assay_failure
  attempted_state: [attempted]
  evaluability_state: [evaluable, not_evaluable]
  observation_state: [positive, negative, not_applicable_technically_unevaluable]
  mapping_state:
    - exact_primary_canonical
    - exact_isoform
    - exact_additional_non_isoform
    - secondary_accession_unique
    - canonical_isoform1_alias
    - ambiguous_frozen_accession
    - not_in_frozen_human_reference
  mapping_confidence:
    - A_exact_frozen_identifier
    - B_unique_frozen_secondary_accession
    - C_canonical_isoform1_alias
    - D_unmapped_or_ambiguous

tables:
  archive_members:
    required_non_null: [archive_asset_id, archive_format, member_ordinal, member_path, member_type, uncompressed_bytes, selected_for_semantics, archive_sha256, safety_state, source_archive_path, license_id, redistribution_tier]
    columns:
      - {name: archive_asset_id, type: string, nullable: false}
      - {name: archive_format, type: string, nullable: false}
      - {name: member_ordinal, type: int64, nullable: false}
      - {name: member_path, type: string, nullable: false}
      - {name: member_type, type: string, nullable: false}
