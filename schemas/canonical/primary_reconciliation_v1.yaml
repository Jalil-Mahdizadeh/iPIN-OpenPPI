schema_name: ipin_openppi_primary_reconciliation
schema_version: 1
status: frozen_for_primary_reconciliation
frozen_date: "2026-08-03"
blueprint: docs/blueprints/iPIN_OpenPPI_Final_Computational_Blueprint_and_Workflow_v3.md
input_schema: schemas/warehouse/evidence_warehouse_v1.yaml

principles:
  source_native_records_are_immutable: true
  reference_sequence_mapping_is_construct_mapping: false
  canonical_projection_is_exact_construct_mapping: false
  identifier_conflicts_are_silently_resolved: false
  structure_mapping_requires_release_alignment: true
  provider_pair_views_are_labels: false
  label_construction_authorized: false

enums:
  mapping_applicability:
    - human_protein
    - nonhuman_protein
    - unresolved_taxon_protein
    - nonprotein_entity
    - unresolved_entity_type
  mapping_state:
    - direct_identifier_unique
    - canonical_isoform_alias_unique
    - cross_reference_unique
    - sequence_equivalent_candidates
    - canonical_projection_only
    - ambiguous
    - unmapped
    - out_of_scope
    - not_applicable
    - unresolved
  mapping_route:
    - direct_uniprot_exact
    - direct_uniprot_isoform1_alias
    - ensembl_protein
    - ensembl_transcript
    - ensembl_gene
    - none
  construct_confidence:
    - A
    - B
    - C
    - D
    - unmapped
    - not_applicable
  representation_state:
    - matched_pair_view
    - detailed_only
    - pair_view_only
    - unresolved_gene_projection
  taxonomy_resolution:
    - human_only
    - human_and_other
    - nonhuman_only
    - no_taxonomy
  accession_match_state:
    - primary_canonical_sequence
    - primary_field_without_canonical
    - additional_sequence_identifier
    - absent
  interval_state:
    - complete_ascending
    - complete_descending
    - incomplete
  structural_mapping_state:
    - blocked_release_mismatch
    - blocked_descending_interval
    - unmatched_frozen_sequence
    - out_of_scope_nonhuman
    - unresolved_taxonomy

