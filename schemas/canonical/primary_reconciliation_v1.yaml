gate_metrics:
  participant_mapping_completeness:
    denominator: all immutable staging participant rows
    required_value: 1.0
  primary_huri_construct_a_or_b_fraction:
    denominator: HuRI evidence records otherwise eligible for a strict construct-aware view
    warning_threshold: 0.80
    expected_current_interpretation: No source record may receive A or B without exact construct sequence or unambiguous isoform plus boundaries.
  technical_or_missing_as_negative_count:
    required_value: 0
  label_authorized_count:
    required_value: 0
  sifts_structural_mapping_authorized_count:
    required_value_while_release_mismatch_open: 0
