gate_metrics:
  provenance_fraction:
    denominator: all evidence_records
    numerator: records with non-null source_key, source_release, raw_file_sha256, parser_name, parser_version, parser_git_commit, container_sif_sha256, license_id, and redistribution_tier
    threshold: 0.95
  systematic_state_resolution_fraction:
    denominator: usable primary-systematic evidence records only; never the unobserved Cartesian product
    numerator: denominator records with search_space_state, selection_state, attempted_state, evaluability_state, technical_state, and observation_state resolved beyond unknown
    threshold: 0.90
    caveat: This metric cannot establish completeness of the attempted pair universe and cannot close ISSUE-0003 by itself.
  strict_construct_a_or_b_fraction:
    denominator: primary-systematic evidence records otherwise eligible for a strict construct-aware view
    numerator: denominator records for which every protein participant has construct_confidence A or B
    threshold: 0.80
  technical_failure_negative_count:
    required_value: 0
    definition: evidence_records where observation_state is negative and technical_state is failed
