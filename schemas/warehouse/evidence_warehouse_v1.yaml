schema_name: ipin_openppi_evidence_warehouse
schema_version: 1
status: frozen_for_primary_source_parsing
frozen_date: "2026-08-03"
blueprint: docs/blueprints/iPIN_OpenPPI_Final_Computational_Blueprint_and_Workflow_v3.md
source_policy: configs/source_policy_v1.yaml

principles:
  primary_object: source_evidence_record
  consensus_pair_is_primary_object: false
  raw_records_immutable: true
  provider_pair_views_are_labels: false
  unreported_pairs_are_negative: false
  technical_failures_are_negative: false
  expanded_nary_projections_are_direct_binary: false
  source_assertions_and_parser_inferences_are_distinct: true

missing_codes:
  - not_reported
  - not_applicable
  - not_parsed
  - unresolved
  - conflicting
  - suppressed_by_license

enums:
  observation_state:
    - positive
    - negative
    - ambiguous
    - technical_failure
    - untested
    - unknown
  search_space_state:
    - inside_declared_space
    - outside_declared_space
    - unknown
    - not_applicable
  selection_state:
    - selected
    - not_selected
    - unknown
    - not_applicable
  attempted_state:
    - attempted
    - not_attempted
    - unknown
    - not_applicable
  evaluability_state:
    - evaluable
    - not_evaluable
    - partially_evaluable
    - unknown
    - not_applicable
  technical_state:
    - passed
    - failed
    - partial
    - unknown
    - not_applicable
  state_basis:
    - source_asserted
    - logically_implied_by_source_positive
    - parser_classified
    - unresolved
    - not_applicable
  interaction_semantics:
    - direct_binary
    - direct_within_complex
    - physical_association
    - association
    - co_complex
    - functional_association
    - unknown
  construct_confidence:
    - A
    - B
    - C
    - D
    - unmapped
    - not_applicable
  mapping_state:
    - exact
    - unique
    - one_to_many
    - many_to_one
    - ambiguous
    - unmapped
    - not_attempted
  redistribution_tier:
    - public_with_attribution
    - public_cc0
    - internal_only

tables:
  evidence_records:
    description: One source interaction/assay observation; never a collapsed consensus pair.
    primary_key: [evidence_id]
    required_non_null:
      - evidence_id
      - source_key
      - source_dataset
      - source_release
      - source_record_id
      - record_kind
      - observation_state
      - interaction_semantics
      - raw_file_path
      - raw_file_sha256
      - raw_locator
      - parser_name
      - parser_version
      - parser_git_commit
      - container_sif_sha256
      - schema_version
      - schema_sha256
      - license_id
      - redistribution_tier
      - missingness_json
    enum_columns:
      observation_state: observation_state
      search_space_state: search_space_state
      selection_state: selection_state
      attempted_state: attempted_state
      evaluability_state: evaluability_state
      technical_state: technical_state
      state_basis: state_basis
      interaction_semantics: interaction_semantics
      redistribution_tier: redistribution_tier
    columns:
      - {name: evidence_id, type: string, nullable: false}
      - {name: source_key, type: string, nullable: false}
      - {name: source_dataset, type: string, nullable: false}
      - {name: source_release, type: string, nullable: false}
      - {name: source_record_id, type: string, nullable: false}
      - {name: source_record_ordinal, type: int64, nullable: true}
      - {name: source_member, type: string, nullable: true}
      - {name: record_kind, type: string, nullable: false}
      - {name: unordered_pair_id, type: string, nullable: true}
      - {name: ordered_pair_id, type: string, nullable: true}
      - {name: experiment_ids, type: "list<string>", nullable: false}
      - {name: publication_ids, type: "list<string>", nullable: false}
      - {name: imex_ids, type: "list<string>", nullable: false}
      - {name: source_database_ids, type: "list<string>", nullable: false}
      - {name: participant_count, type: int32, nullable: false}
      - {name: original_nary, type: bool, nullable: false}
      - {name: is_expanded_projection, type: bool, nullable: false}
      - {name: expansion_method_ac, type: string, nullable: true}
      - {name: expansion_method_name, type: string, nullable: true}
      - {name: negative_flag, type: bool, nullable: true}
      - {name: interaction_type_ac, type: string, nullable: true}
      - {name: interaction_type_name, type: string, nullable: true}
      - {name: interaction_semantics, type: string, nullable: false}
      - {name: detection_method_ac, type: string, nullable: true}
      - {name: detection_method_name, type: string, nullable: true}
      - {name: participant_identification_method_ac, type: string, nullable: true}
      - {name: participant_identification_method_name, type: string, nullable: true}
      - {name: assay_family, type: string, nullable: true}
      - {name: assay_version, type: string, nullable: true}
      - {name: assay_batch, type: string, nullable: true}
      - {name: host_taxid, type: int64, nullable: true}
